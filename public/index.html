<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoTransport · Realtime Transit Tracker</title>
  <meta name="description" content="Realtime tracking en doorgangsinformatie van openbaar vervoer in Vlaanderen en België" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    /* ── Source Sans Pro (Flemish Government Niveau 4 Standard) ──────────────── */
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-Semibold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-SemiboldItalic.ttf') format('truetype');
      font-weight: 600;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Sans Pro';
      src: url('/fonts/SourceSansPro/SourceSansPro-BoldItalic.ttf') format('truetype');
      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Digitaal Vlaanderen Design System Tokens (Niveau 4) ──────────────────── */
    :root {
      /* Primary Brand: Deep Pine / Juniper Green (strictly non-yellow, non-blue) */
      --primary: #0D5C3A;
      --primary-hover: #083D26;
      --primary-light: rgba(13, 92, 58, 0.08);
      --primary-border: rgba(13, 92, 58, 0.22);
      --accent: var(--primary);
      --action: var(--primary);
      --action-hover: var(--primary-hover);

      /* Functional status colors (Vlaanderen Design System) */
      --success: #009E47;
      --green: #009E47;
      --warning: #D97706;
      --orange: #D97706;
      --danger: #D2373C;
      --re: #D2373C;
      --accent2: #D97706;
      --accent3: #009E47;

      /* Neutrals & surfaces */
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --surface2: #EEF2F6;
      --surface-hover: #F1F5F9;
      --surface-active: #E8F0EA;
      --border: #CFD5DD;
      --border-subtle: #E2E8F0;
      --text: #333332;
      --text-dim: #687483;
      --text-muted: #8695A8;
      --di: #687483;

      /* Component geometry */
      --panel: 340px;
      --sidebar-w: 320px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.12);

      --font-ui: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Source Sans Pro', monospace;
    }

    /* ── Dark Theme Tokens ───────────────────────────────────────────────────── */
    [data-theme="dark"] {
      --primary: #34D399;
      --primary-hover: #6EE7B7;
      --primary-light: rgba(52, 211, 153, 0.12);
      --primary-border: rgba(52, 211, 153, 0.3);
      --accent: var(--primary);
      --action: var(--primary);
      --action-hover: var(--primary-hover);

      --success: #10B981;
      --green: #10B981;
      --warning: #FBBF24;
      --orange: #FBBF24;
      --danger: #F87171;
      --re: #F87171;
      --accent2: #FBBF24;
      --accent3: #10B981;

      --bg: #0B131E;
      --surface: #131F2E;
      --surface2: #1B2B3E;
      --surface-hover: #1E3147;
      --surface-active: rgba(52, 211, 153, 0.15);
      --border: #26394E;
      --border-subtle: #1C2D40;
      --text: #F1F5F9;
      --text-dim: #94A3B8;
      --text-muted: #64748B;
      --di: #94A3B8;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.6);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.45;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Accessible focus rings */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    #map {
      flex: 1;
      height: 100%;
      background: var(--bg);
      z-index: 1;
    }

    /* ── Sidebar (Flemish Basisgrid structure) ─────────────────────────────────── */
    #sidebar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: var(--shadow-md);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */
    #header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo-brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .logo-mark svg {
      width: 20px;
      height: 20px;
    }

    .logo-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.15;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Theme Switcher Button */
    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .theme-toggle-btn:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
      color: var(--primary);
    }
    .theme-toggle-btn svg {
      width: 17px;
      height: 17px;
    }

    /* ── Search Bar ──────────────────────────────────────────────────────────── */
    #search-wrap {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      background: var(--surface);
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    #search-input {
      width: 100%;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 32px 0 32px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search-input::placeholder {
      color: var(--text-muted);
    }
    #search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-border);
      background: var(--surface);
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-icon svg {
      width: 15px;
      height: 15px;
    }

    #search-clear {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #search-clear:hover {
      color: var(--text);
      background: var(--surface2);
    }
    #search-clear svg {
      width: 13px;
      height: 13px;
    }

    #search-drop {
      position: absolute;
      top: calc(100% - 2px);
      left: 16px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      z-index: 500;
      display: none;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    #search-drop.on {
      display: block;
    }
    .sd-group {
      padding: 6px 12px 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg);
      border-top: 1px solid var(--border-subtle);
    }
    .sd-group:first-child {
      border-top: none;
    }
    .sd-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }
    .sd-item:last-child {
      border-bottom: none;
    }
    .sd-item:hover, .sd-item.hi {
      background: var(--primary-light);
    }
    .sd-badge {
      flex-shrink: 0;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      min-width: 28px;
      text-align: center;
    }
    .sd-main {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sd-sub {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sd-delay {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Status Bar ──────────────────────────────────────────────────────────── */
    #status-bar {
      padding: 9px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      position: relative;
    }
    .pulse::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--success);
      opacity: 0.8;
      animation: pa 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .pulse.err {
      background: var(--danger);
      animation: none;
    }
    .pulse.err::after {
      border-color: var(--danger);
      animation: none;
    }
    .pulse.spin {
      background: var(--primary);
      animation: sp 1s linear infinite;
    }
    .pulse.spin::after {
      display: none;
    }
    @keyframes pa {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes sp {
      to { transform: rotate(360deg); }
    }
    .status-ts {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    #bar-wrap {
      height: 3px;
      background: var(--border-subtle);
      border-radius: 2px;
      margin-top: 7px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.25s linear;
    }

    /* ── Metrics Cards Grid (Basisgrid) ──────────────────────────────────────── */
    #stats {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex-shrink: 0;
      background: var(--surface);
    }
    .sc {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .sc:hover {
      background: var(--surface);
      border-color: var(--primary);
    }
    .sn {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .sn.gr { color: var(--success); }
    .sn.or { color: var(--warning); }
    .sn.re { color: var(--danger); }
    .sn.ye { color: var(--warning); }
    .sn.di { color: var(--text-dim); }
    .sl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* ── Tabs ────────────────────────────────────────────────────────────────── */
    #tabs {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab:hover {
      color: var(--text);
      background: var(--bg);
    }
    .tab.av {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }
    .tab.ac {
      color: var(--danger);
      border-bottom-color: var(--danger);
      font-weight: 700;
    }
    .tb {
      padding: 1px 7px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      background: var(--surface2);
      color: var(--text-dim);
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
    .tab.av .tb {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* ── Virtual Scroll Panes ────────────────────────────────────────────────── */
    .pane {
      display: none;
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      position: relative;
      background: var(--surface);
    }
    .pane.on {
      display: block;
    }
    .pane::-webkit-scrollbar {
      width: 5px;
    }
    .pane::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    .vs {
      width: 1px;
    }
    .vw {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }

    .vr {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.12s;
      padding: 0 16px;
      box-sizing: border-box;
    }
    .vr:hover {
      background: var(--surface-hover);
    }
    .vr.sel {
      background: var(--surface-active);
      border-left: 4px solid var(--primary);
      padding-left: 12px;
    }
    .vr.cr {
      cursor: default;
    }
    .vr.cr:hover {
      background: transparent;
    }

    .badge {
      width: 42px;
      height: 24px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .ri {
      flex: 1;
      min-width: 0;
    }
    .rr {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .rm {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .rd {
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .cx {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--danger);
      background: rgba(210, 55, 60, 0.12);
      border: 1px solid rgba(210, 55, 60, 0.3);
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      flex-shrink: 0;
    }

    /* ── Sidebar Partner / Secondary Footer (Niveau 4 Requirement) ───────────── */
    #sidebar-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.35;
    }
    .sf-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .sf-partners {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .sf-dot {
      color: var(--border);
    }

    /* ── Slide-out Info Panel (Right) ────────────────────────────────────────── */
    #info-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--panel);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 200;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #info-panel.open {
      transform: translateX(0);
    }
    #ip-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg);
    }
    #ip-badge {
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    #ip-title {
      font-size: 14px;
      font-weight: 700;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    #ip-close {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    #ip-close:hover {
      border-color: var(--text);
      color: var(--text);
      background: var(--surface-hover);
    }
    #ip-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--surface);
    }
    #ip-body::-webkit-scrollbar {
      width: 4px;
    }
    #ip-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
    .ip-section {
      margin-bottom: 18px;
    }
    .ip-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .ip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .ip-field {}
    .ip-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .ip-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }
    .ip-value.accent { color: var(--primary); }
    .ip-value.danger { color: var(--danger); }
    .ip-value.green { color: var(--success); }
    .ip-value.orange { color: var(--warning); }
    .ip-value.di { color: var(--text-dim); }
    .ip-full { grid-column: 1 / -1; }
    .ip-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
    .ip-link:hover {
      text-decoration: underline;
    }
    .ip-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 5px;
    }
    .ip-share-btn {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .ip-share-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ── Stop Timeline in Vehicle Panel ──────────────────────────────────────── */
    .stop-list {
      margin-top: 6px;
      position: relative;
    }
    .stop-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }
    .stop-row:last-child {
      border-bottom: none;
    }
    .stop-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--text-dim);
      flex-shrink: 0;
      margin-top: 3px;
    }
    .stop-dot.passed {
      background: var(--border);
      border-color: var(--border);
    }
    .stop-dot.next {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-border);
    }
    .stop-dot.term {
      background: var(--danger);
      border-color: var(--danger);
    }
    .stop-info {
      flex: 1;
      min-width: 0;
    }
    .stop-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stop-name.passed {
      color: var(--text-muted);
      font-weight: 400;
    }
    .stop-times {
      display: flex;
      gap: 6px;
      margin-top: 2px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }
    .stop-times .adj {
      color: var(--success);
      font-weight: 600;
    }
    .stop-times .late {
      color: var(--warning);
      font-weight: 600;
    }
    .stop-times .vlate {
      color: var(--danger);
      font-weight: 700;
    }

    /* ── Leaflet Popups ──────────────────────────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow-lg) !important;
      color: var(--text) !important;
      font-family: var(--font-ui) !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip-container {
      display: none !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
    }
    .mp {
      padding: 14px 16px;
      min-width: 220px;
    }
    .mp-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .mp-dest {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .mp-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .mp-delay {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .mp-btn {
      width: 100%;
      height: 34px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #FFFFFF;
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    [data-theme="dark"] .mp-btn {
      color: #0B131E;
    }
    .mp-btn:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .mp-link {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 10px;
    }
    .mp-link:hover {
      text-decoration: underline;
    }

    /* Stop Popup Departures */
    .sp-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }
    .sp-id {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .sp-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .sp-lines {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }
    .sp-line-badge, .sp-approach-badge {
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .sp-line-badge:hover {
      opacity: 0.85;
    }

    .dk-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .dk-row:last-child {
      border-bottom: none;
    }
    .dk-row.canceled {
      opacity: 0.65;
    }
    .dk-badge {
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      min-width: 28px;
      text-align: center;
    }
    .dk-dest {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dk-dest .vias {
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 400;
    }
    .dk-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }
    .dk-eta {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .dk-eta.now { color: var(--success); }
    .dk-eta.soon { color: var(--text); }
    .dk-times {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 10px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .dk-sched { color: var(--text-dim); }
    .dk-sched.strike { text-decoration: line-through; }
    .dk-rt { color: var(--warning); font-weight: 600; }
    .dk-rt.early { color: var(--success); }
    .dk-canceled-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--danger);
      background: rgba(210, 55, 60, 0.12);
      border: 1px solid rgba(210, 55, 60, 0.3);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
      white-space: nowrap;
    }
    .dk-track {
      font-size: 10px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.12s;
    }
    .dk-track:hover {
      background: var(--surface2);
    }
    .sp-none {
      color: var(--text-dim);
      font-size: 12px;
      padding: 6px 0;
    }

    /* ── Controls & Floating Buttons ─────────────────────────────────────────── */
    .leaflet-control-attribution {
      background: var(--surface) !important;
      color: var(--text-dim) !important;
      font-size: 11px !important;
      border-radius: var(--radius-sm) !important;
      border: 1px solid var(--border) !important;
      box-shadow: var(--shadow-sm) !important;
    }
    .leaflet-control-attribution a {
      color: var(--primary) !important;
      text-decoration: none !important;
    }
    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      box-shadow: var(--shadow-sm) !important;
      border-radius: var(--radius-sm) !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
      width: 32px !important;
      height: 32px !important;
      line-height: 32px !important;
    }
    .leaflet-control-zoom a:hover {
      background: var(--surface-hover) !important;
      color: var(--primary) !important;
    }

    #locate-btn {
      position: absolute;
      right: 12px;
      bottom: 90px;
      z-index: 400;
      width: 36px;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    #locate-btn:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
      color: var(--primary);
    }
    #locate-btn.locating {
      color: var(--primary);
      animation: loc-spin 1.4s linear infinite;
    }
    #locate-btn.located {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    #locate-btn svg {
      width: 19px;
      height: 19px;
    }
    @keyframes loc-spin {
      to { transform: rotate(360deg); }
    }

    /* User location marker */
    .user-loc-wrap {
      position: relative;
      width: 22px;
      height: 22px;
    }
    .user-loc-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: var(--primary-border);
      animation: loc-pulse 2.2s ease-out infinite;
      pointer-events: none;
    }
    .user-loc-dot {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    @keyframes loc-pulse {
      0% { transform: scale(1); opacity: 0.8; }
      60% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    #mob-fab {
      display: none;
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 350;
      background: var(--primary);
      border: 1px solid var(--primary-hover);
      border-radius: 24px;
      padding: 10px 20px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      transition: background 0.15s;
      align-items: center;
      gap: 8px;
    }
    [data-theme="dark"] #mob-fab {
      color: #0B131E;
    }
    #mob-fab:hover {
      background: var(--primary-hover);
    }
    #mob-fab svg {
      width: 16px;
      height: 16px;
    }

    #brand {
      position: absolute;
      bottom: 24px;
      left: calc(var(--sidebar-w) + 16px);
      z-index: 50;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
    }

    #zoom-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      box-shadow: var(--shadow-md);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
    #zoom-hint.on {
      opacity: 1;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      z-index: 9999;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      max-width: 320px;
      box-shadow: var(--shadow-lg);
    }
    #toast.on {
      opacity: 1;
      transform: translateY(0);
    }
    #toast.er {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--surface);
    }

    /* Stop markers & tooltip */
    .stop-mk { pointer-events: auto !important; }
    .stop-tip {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      font-family: var(--font-ui) !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      padding: 4px 8px !important;
      border-radius: var(--radius-sm) !important;
      box-shadow: var(--shadow-sm) !important;
      white-space: nowrap;
    }

    /* Mobile drawer handle & close */
    .mob-close-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 10;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .mob-close-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }
    #mob-handle {
      display: none;
      width: 38px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 2px;
      flex-shrink: 0;
    }

    /* ── Responsive adjustments ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        width: 100%;
        height: 70vh;
        border-right: none;
        border-top: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
        z-index: 400;
      }
      #sidebar.mob-open {
        transform: translateY(0);
      }
      #mob-handle {
        display: block !important;
      }
      .mob-close-btn {
        display: flex !important;
      }
      #info-panel {
        top: auto;
        right: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 72vh;
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
      }
      #info-panel.open {
        transform: translateY(0);
      }
      #mob-fab {
        display: flex;
      }
      #brand {
        display: none;
      }
      #toast {
        bottom: 80px;
        right: 16px;
        left: 16px;
        max-width: none;
      }
      #locate-btn {
        bottom: 80px;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar" role="region" aria-label="Hoofdmenu en overzicht">
    <div id="mob-handle"></div>
    <button class="mob-close-btn" onclick="closeSidebarMobile()" title="Sluiten" aria-label="Sluit menu">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div id="header">
      <div class="logo-row">
        <div class="logo-brand-wrap">
          <div class="logo-mark" aria-hidden="true">
            <!-- Modern Flemish line style transit vehicle & route mark -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3" width="16" height="13" rx="2.5"></rect>
              <line x1="4" y1="10" x2="20" y2="10"></line>
              <line x1="7" y1="19" x2="6" y2="21"></line>
              <line x1="17" y1="19" x2="18" y2="21"></line>
              <circle cx="8" cy="13.5" r="1.2" fill="currentColor"></circle>
              <circle cx="16" cy="13.5" r="1.2" fill="currentColor"></circle>
            </svg>
          </div>
          <div>
            <div class="logo-name">GeoTransport</div>
            <div class="logo-sub">Realtime Openbaar Vervoer & Tracking</div>
          </div>
        </div>
        <!-- Theme toggle button -->
        <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Wissel naar donkere modus" aria-label="Wissel naar donkere modus">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon-sun" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
      </div>
    </div>

    <div id="search-wrap" role="search">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16" y2="16"></line>
          </svg>
        </span>
        <input id="search-input" type="text" placeholder="Zoek lijn, halte, rit, voertuig…" autocomplete="off" aria-label="Zoeken" />
        <button id="search-clear" onclick="clearSearch()" title="Zoekopdracht wissen" aria-label="Zoekopdracht wissen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="search-drop" role="listbox"></div>
    </div>

    <div id="status-bar">
      <div class="status-row">
        <div class="live-dot">
          <div class="pulse spin" id="pd"></div>
          <span id="lt">Verbinden…</span>
        </div>
        <div class="status-ts" id="ts">–</div>
      </div>
      <div id="bar-wrap" aria-hidden="true"><div id="bar" style="width:0%"></div></div>
    </div>

    <div id="stats">
      <div class="sc"><div class="sn" id="sv">–</div><div class="sl">Actief</div></div>
      <div class="sc"><div class="sn gr" id="so">–</div><div class="sl">Op tijd</div></div>
      <div class="sc"><div class="sn or" id="sd">–</div><div class="sl">Vertraagd</div></div>
      <div class="sc"><div class="sn re" id="sc2">–</div><div class="sl">Afgeschaft</div></div>
      <div class="sc"><div class="sn ye" id="se2">–</div><div class="sl">Vroeg</div></div>
      <div class="sc"><div class="sn di" id="se">–</div><div class="sl">Totaal</div></div>
    </div>

    <div id="tabs" role="tablist">
      <div class="tab av" id="tv" role="tab" aria-selected="true" onclick="switchTab('v')">
        Voertuigen <span class="tb" id="bv">0</span>
      </div>
      <div class="tab" id="tc" role="tab" aria-selected="false" onclick="switchTab('c')">
        Afgeschaft <span class="tb" id="bc">0</span>
      </div>
    </div>

    <div class="pane on" id="pv"><div class="vs" id="sv2"></div><div class="vw" id="wv"></div></div>
    <div class="pane" id="pc"><div class="vs" id="sc3"></div><div class="vw" id="wc"></div></div>

    <!-- Secondary footer (Niveau 4 - Hoofdpartnerschappen lange termijn) -->
    <footer id="sidebar-footer">
      <div class="sf-row">
        <span class="sf-title">GeoTransport Platform</span>
        <span class="sf-version">Vlaanderen Niveau 4</span>
      </div>
      <div class="sf-partners">
        <span class="sf-partner">GTFS-RT</span>
        <span class="sf-dot">•</span>
        <span class="sf-partner">OpenStreetMap</span>
        <span class="sf-dot">•</span>

  </aside>

  <div id="map"></div>

    <svg class="locate-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"></circle>
      <line x1="12" y1="2" x2="12" y2="5"></line>
      <line x1="12" y1="19" x2="12" y2="22"></line>
      <line x1="2" y1="12" x2="5" y2="12"></line>

  <div id="info-panel" role="dialog" aria-modal="true" aria-label="Voertuig details">

        <line x1="18" y1="6" x2="6" y2="18"></line>

          <line x1="18" y1="6" x2="6" y2="18"></line>

</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const REFRESH = 15000;
const TILE_LIGHT = "https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png?key=__CARTO_KEY__";
const TILE_DARK  = "https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=__CARTO_KEY__";
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>';
const IH_V = 52, IH_C = 46;
const ROUTE_TYPES = {'0':'Tram','1':'Metro','2':'Trein','3':'Bus','4':'Veerboot','11':'Trolleybus'};

// ── Theme management (Light / Dark) ──────────────────────────────────────────
let currentTheme = 'light';
let mapTileLayer = null;

function applyTheme(t, save = true) {
  currentTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  if (save) {
    try { localStorage.setItem('geotransport-theme', t); } catch(_) {}
  }
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.setAttribute('aria-label', t === 'dark' ? 'Schakel over naar lichte modus' : 'Schakel over naar donkere modus');
    btn.setAttribute('title', t === 'dark' ? 'Lichte modus' : 'Donkere modus');
    const sun = btn.querySelector('.theme-icon-sun');
    const moon = btn.querySelector('.theme-icon-moon');
    if (sun && moon) {
      sun.style.display = t === 'dark' ? 'block' : 'none';
      moon.style.display = t === 'dark' ? 'none' : 'block';
    }
  }
  const url = t === 'dark' ? TILE_DARK : TILE_LIGHT;
  if (mapTileLayer) {
    mapTileLayer.setUrl(url);
  } else if (map) {
    mapTileLayer = L.tileLayer(url, { attribution: ATTR, subdomains: "abcd", maxZoom: 19 }).addTo(map);
  }
  if (allStopsLayer) allStopsLayer._draw();
  if (arrowLayer) arrowLayer._draw();
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

// ── User geolocation ──────────────────────────────────────────────────────────
let _userMarker = null, _userCircle = null;
let _locatedOnce = false;
let _geoExplicit = false;

const _locBtn = () => document.getElementById('locate-btn');

function _updateUserMarker(lat, lng, accuracy) {
  if (_userCircle) _userCircle.remove();
  const themeCol = currentTheme === 'dark' ? '#34D399' : '#0D5C3A';
  if (accuracy > 0 && accuracy < 50000) {
    _userCircle = L.circle([lat, lng], {
      radius: accuracy, color: themeCol, fillColor: themeCol,
      fillOpacity: 0.08, weight: 1.5, dashArray: '4 4', interactive: false,
    }).addTo(map);
    _userCircle.bringToBack();
  }
  if (_userMarker) _userMarker.remove();
  const icon = L.divIcon({
    className: '',
    html: '<div class="user-loc-wrap"><div class="user-loc-ring"></div><div class="user-loc-dot"></div></div>',
    iconSize: [22, 22], iconAnchor: [11, 11],
  });
  _userMarker = L.marker([lat, lng], { icon, interactive: false, zIndexOffset: 800 }).addTo(map);
  const btn = _locBtn();
  if (btn) { btn.classList.remove('locating'); btn.classList.add('located'); }
}

function _onGeoSuccess(pos) {
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  _updateUserMarker(lat, lng, accuracy);
  if (!_locatedOnce) {
    _locatedOnce = true;
    const sp = new URLSearchParams(location.search);
    const hasUrlState = sp.has('vehicle') || sp.has('line') || sp.has('route') || sp.has('trip');
    if (!hasUrlState) map.setView([lat, lng], 14, { animate: true });
  }
}

function _onGeoError(err) {
  const btn = _locBtn();
  if (btn) btn.classList.remove('locating', 'located');
  if (_geoExplicit) {
    const msg = err.code === 1 ? 'Locatietoegang geweigerd'
              : err.code === 2 ? 'Positie niet beschikbaar' : 'Locatieverzoek verlopen';
    toast('⚠ ' + msg, true);
  }
  _geoExplicit = false;
}

function initGeolocation() {
  if (!navigator.geolocation) return;
  _geoExplicit = false;
  navigator.geolocation.getCurrentPosition(_onGeoSuccess, _onGeoError,
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
  navigator.geolocation.watchPosition(_onGeoSuccess, () => {},
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
}

function goToMyLocation() {
  if (!navigator.geolocation) { toast('⚠ Geolocation wordt niet ondersteund door uw browser', true); return; }
  const btn = _locBtn();
  if (btn) { btn.classList.add('locating'); btn.classList.remove('located'); }
  _geoExplicit = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      _updateUserMarker(lat, lng, accuracy);
      map.setView([lat, lng], Math.max(map.getZoom(), 15), { animate: true });
      _geoExplicit = false;
    },
    err => _onGeoError(err),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
  );
}

// ── Static lookup ─────────────────────────────────────────────────────────────
let SL = null;
let STOPS = null;
let STOPS_tried = false;
let STOP_INDEX = null;
let STOP_INDEX_tried = false;

async function loadStatic() {
  try {
    const r = await fetch('/static-lookup.json', { cache: 'force-cache' });
    if (!r.ok) return;
    SL = await r.json();
    arrowLayer.setVehicles(Object.values(vData));
    redraw();
    if (activeId && vData[activeId]) {
      const v = vData[activeId];
      const ti = getTrip(v.tripId);
      const lc = v.tripId?.split('_')[0];
      if (ti?.shapeId && lc) showShape(ti.shapeId, lc).catch(() => {});
      if (activePopup) showPopup(activeId);
    }
  } catch(e) { console.warn('Static lookup:', e.message); }
}

async function loadStops() {
  if (STOPS !== null) return;
  if (STOPS_tried) {
    await new Promise(r => setTimeout(r, 30));
    return;
  }
  STOPS_tried = true;
  try {
    const r = await fetch('/stops.json', { cache: 'force-cache' });
    if (r.ok) { STOPS = await r.json(); allStopsLayer._draw(); }
    else { STOPS = {}; if (r.status !== 404) console.warn('Stops: HTTP', r.status); }
  } catch(e) { STOPS = {}; console.warn('Stops:', e.message); }
}

let _stopIndexPromise = null;
async function loadStopIndex() {
  if (STOP_INDEX !== null) return;
  if (_stopIndexPromise) return _stopIndexPromise;
  _stopIndexPromise = (async () => {
    try {
      const r = await fetch('/stop-index.json', { cache: 'force-cache' });
      STOP_INDEX = r.ok ? await r.json() : {};
      if (!r.ok && r.status !== 404) console.warn('Stop-index: HTTP', r.status);
    } catch(e) { STOP_INDEX = {}; console.warn('Stop-index:', e.message); }
  })();
  STOP_INDEX_tried = true;
  return _stopIndexPromise;
}

const ST = {};
const ST_loading = new Set();

async function loadStopTimes(tripId) {
  if (!tripId) return;
  const lineCode = tripId.split('_')[0];
  if (ST[lineCode] !== undefined) return;
  if (ST_loading.has(lineCode)) {
    await new Promise(resolve => {
      const id = setInterval(() => { if (!ST_loading.has(lineCode)) { clearInterval(id); resolve(); } }, 20);
    });
    return;
  }
  ST_loading.add(lineCode);
  try {
    const r = await fetch(`/stop-times/${lineCode}.json`, { cache: 'force-cache' });
    if (r.ok) { ST[lineCode] = await r.json(); if (activeFilter) allStopsLayer.setRouteFilter(getFilterStopIds()); }
    else { console.warn(`[GT] stop-times/${lineCode}.json → HTTP ${r.status}`); ST[lineCode] = {}; }
  } catch(e) { ST[lineCode] = {}; }
  finally { ST_loading.delete(lineCode); }
}

function getTripStops(tripId) {
  if (!tripId) return null;
  const lineCode = tripId.split('_')[0];
  const key      = tripId.split('_').slice(0,3).join('_');
  const result   = ST[lineCode]?.[key] || null;
  if (ST[lineCode] && !result) {
    console.warn(`[GT] getTripStops miss — looked up "${key}", sample:`, Object.keys(ST[lineCode] || {}).slice(0,3));
  }
  return result;
}

const shapeChunkCache = {};
const shapeChunkLoading = new Set();

async function fetchShape(shapeId, lineCode) {
  if (!shapeId) return null;
  const lc = lineCode || shapeId.slice(0, 4);
  if (!lc) return null;
  if (!shapeChunkCache[lc] && !shapeChunkLoading.has(lc)) {
    shapeChunkLoading.add(lc);
    try {
      const r = await fetch(`/shapes/${lc}.json`, { cache: 'force-cache' });
      shapeChunkCache[lc] = r.ok ? await r.json() : {};
      if (!r.ok) console.warn(`[GT] shapes/${lc}.json → HTTP ${r.status}`);
    } catch(e) { shapeChunkCache[lc] = {}; }
    finally { shapeChunkLoading.delete(lc); }
  }
  while (shapeChunkLoading.has(lc)) await new Promise(r => setTimeout(r, 20));
  return shapeChunkCache[lc]?.[shapeId] || null;
}

async function showShape(shapeId, lineCode, fitBounds = false) {
  clearShape();
  const pts = await fetchShape(shapeId, lineCode);
  if (!pts?.length) return;
  const valid = pts.filter(p => p[0] != null && p[1] != null && !isNaN(p[0]) && !isNaN(p[1]));
  if (!valid.length) return;
  const shapeCol = currentTheme === 'dark' ? '#34D399' : '#0D5C3A';
  shapePolyline = L.polyline(valid, { color: shapeCol, weight: 3.5, opacity: 0.65, interactive: false }).addTo(map);
  shapePolyline.bringToBack();
  if (fitBounds) map.fitBounds(shapePolyline.getBounds(), { padding: [40, 40], maxZoom: 14, animate: true });
}

function getLine(tripId)  { if (!SL || !tripId) return null; return SL.lines?.[tripId.split('_')[0]] || null; }
function getTrip(tripId)  { if (!SL || !tripId) return null; return SL.trips?.[tripId.split('_').slice(0,3).join('_')] || null; }
function getRoute(routeId){ if (!SL || !routeId) return null; return SL.routes?.[routeId] || null; }
function getStop(stopId)  { if (!STOPS || !stopId) return null; const s = STOPS[stopId]; if (!s) return null; return { name: s.n, lat: s.a, lon: s.o }; }

function lineName(tripId)      { return getLine(tripId)?.name || '…'; }
function lineDest(tripId)      { return getTrip(tripId)?.headsign || ''; }
function lineType(tripId)      { return getLine(tripId)?.type || '3'; }
function lineTypeLabel(tripId) { return ROUTE_TYPES[lineType(tripId)] || 'Bus'; }
function lineColor(tripId)     { const c = getLine(tripId)?.color; return c ? '#'+c : null; }
function lineTextColor(tripId) { const c = getLine(tripId)?.textColor; return c ? '#'+c : '#ffffff'; }

/* Non-yellow accessible palette for routes */
const PAL = ["#0D5C3A","#1D4ED8","#B45309","#9333EA","#0F766E","#C2410C","#4338CA","#BE185D","#0369A1","#15803D"];
function palCol(k) { let h=0; for (let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))&0xffffffff; return PAL[Math.abs(h)%PAL.length]; }
function markerCol(tripId) { return lineColor(tripId) || palCol(tripId); }

function fmtD(s) {
  if (s==null||s===0) return {text:'Op tijd',cls:'green'};
  const sg=s>0?'+':'−', a=Math.abs(Math.round(s));
  const text = a<60?`${sg}${a}s`:`${sg}${Math.floor(a/60)}m ${a%60}s`;
  return {text, cls: s>=60?'danger':s<-30?'green':'di'};
}
function fmtB(d) { if (d==null) return '–'; return ["N","NO","O","ZO","Z","ZW","W","NW"][Math.round(d/45)%8]+` ${Math.round(d)}°`; }
function fmtMins(m) { if (m==null) return ''; const h=Math.floor(m/60)%24,mn=m%60; return `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`; }

// ── Filter stop IDs ───────────────────────────────────────────────────────────
function getFilterStopIds() {
  if (!activeFilter || !activeFilter.urlKey || activeFilter.urlKey === 'type') return null;
  const ids = new Set(); let found = false;
  if (activeFilter.urlKey === 'line') {
    const lc = activeFilter.urlVal;
    if (ST[lc]) { found=true; for (const seq of Object.values(ST[lc])) for (const {s} of seq) ids.add(s); }
  } else {
    for (const v of Object.values(vData)) {
      if (!activeFilter.matchIds?.has(v.vehicleId)) continue;
      const lc = v.tripId?.split('_')[0];
      if (!lc || !ST[lc]) continue;
      found=true; for (const seq of Object.values(ST[lc])) for (const {s} of seq) ids.add(s);
    }
  }
  return found ? ids : null;
}

// ── Doorkomsten (live departure board) ────────────────────────────────────────
async function fetchStopDoorkomsten(stopId) {
  try {
    const r = await fetch(`/api/kern/halte-rt?id=${encodeURIComponent(stopId)}`, { cache: 'no-store' });
    if (!r.ok) {
      let body = '';
      try { body = await r.text(); } catch(_) {}
      console.error(`[GT] /api/kern/halte-rt HTTP ${r.status} for stop ${stopId}:`, body);
      return { _error: `API ${r.status}: ${body.slice(0, 120) || '(leeg)'}` };
    }
    const data = await r.json();
    if (!Array.isArray(data.doorkomsten)) {
      console.error('[GT] unexpected doorkomsten shape:', Object.keys(data));
      return { _error: `Onverwacht formaat: ${Object.keys(data).join(', ')}` };
    }
    return data.doorkomsten;
  } catch(e) {
    console.error('[GT] fetchStopDoorkomsten threw:', e.message);
    return { _error: e.message };
  }
}

function parseHM(str) {
  if (!str) return null;
  const match = str.match(/T(\d{2}):(\d{2})/);
  if (!match) return null;
  const h = +match[1], m = +match[2];
  return { h, m, total: h * 60 + m };
}

function fmtHM(t) {
  if (!t) return '';
  return `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`;
}

function buildDoorkomstenHtml(doorkomsten) {
  if (doorkomsten === undefined) {
    return '<div class="sp-none">Vertrektijden laden…</div>';
  }
  if (doorkomsten && typeof doorkomsten === 'object' && !Array.isArray(doorkomsten) && doorkomsten._error) {
    return `<div class="sp-none" style="color:var(--danger)">${doorkomsten._error}</div>`;
  }
  if (!Array.isArray(doorkomsten) || !doorkomsten.length) {
    return '<div class="sp-none">Geen geplande vertrekken gevonden</div>';
  }

  const nowH   = new Date().getHours();
  const nowMins = nowH * 60 + new Date().getMinutes();

  return doorkomsten.map(d => {
    const isCanceled = d.status.some(s =>
      s === 'CANCELED' || s === 'CANCELLED' || s === 'GECANCELD' || s === 'GEANNULEERD'
    );

    const sched = parseHM(d.scheduled);
    const rt    = parseHM(d.realtime);
    const hasRealtime = rt && sched && rt.total !== sched.total;
    const isDelayed   = hasRealtime && rt.total > sched.total;
    const isEarly     = hasRealtime && rt.total < sched.total;

    let color = '#0D5C3A', textC = '#ffffff';
    if (SL?.lines) {
      const entry = Object.entries(SL.lines).find(([, l]) => l.name === String(d.lijnnummer));
      if (entry) {
        const l = entry[1];
        if (l.color)     color = '#' + l.color;
        if (l.textColor) textC = '#' + l.textColor;
      }
    }

    const etaTime = (rt || sched);
    let etaMins = etaTime ? etaTime.total - nowMins : null;
    if (etaMins !== null && etaMins < -60) etaMins += 1440;

    let etaHtml;
    if (isCanceled) {
      etaHtml = '<span class="dk-canceled-badge">AFGESCHAFT</span>';
    } else if (etaMins === null) {
      etaHtml = '';
    } else if (etaMins <= 0) {
      etaHtml = '<span class="dk-eta now">Nu</span>';
    } else {
      etaHtml = `<span class="dk-eta soon">${etaMins} min</span>`;
    }

    let timesHtml = '';
    if (sched) {
      const schedStr = fmtHM(sched);
      if (isCanceled) {
        timesHtml = `<span class="dk-sched strike">${schedStr}</span>`;
      } else if (hasRealtime) {
        const rtStr = fmtHM(rt);
        timesHtml = `<span class="dk-sched strike">${schedStr}</span><span class="dk-rt${isEarly ? ' early' : ''}">${rtStr}</span>`;
      } else {
        timesHtml = `<span class="dk-sched">${schedStr}</span>`;
      }
    }

    const viasHtml = d.vias?.length ? ` <span class="vias">via ${d.vias.join(', ')}</span>` : '';
    const vrtStr = d.vrtnum !== null && d.vrtnum !== undefined ? String(d.vrtnum) : null;
    const trackable = vrtStr && vData[vrtStr] && !isCanceled;
    const trackHtml = trackable
      ? `<span class="dk-track" onclick="selectApproachingVehicle('${vrtStr}')" title="Volg voertuig ${vrtStr}">Volg</span>`
      : '';

    const rowClass = `dk-row${isCanceled ? ' canceled' : ''}`;
    const rowClick = trackable ? `onclick="selectApproachingVehicle('${vrtStr}')" style="cursor:pointer"` : '';

    return `<div class="${rowClass}" ${rowClick}>
      <span class="dk-badge" style="background:${color};color:${textC}">${d.lijnnummer || '?'}</span>
      <span class="dk-dest">→ ${d.bestemming || '–'}${viasHtml}</span>
      <span class="dk-right">
        ${etaHtml}
        <span class="dk-times">${timesHtml}${trackHtml ? '&nbsp;' + trackHtml : ''}</span>
      </span>
    </div>`;
  }).join('');
}

// ── Map initialization ────────────────────────────────────────────────────────
const map = L.map("map", { center: [51.0, 4.3], zoom: 9, preferCanvas: true, zoomControl: true });

// ── All-stops canvas layer ────────────────────────────────────────────────────
const AllStopsLayer = L.Layer.extend({
  initialize() { this._activeStopId=null; this._routeStopIds=null; },
  onAdd(map) {
    this._map=map;
    this._canvas=L.DomUtil.create('canvas','leaflet-layer');
    map.getPanes().overlayPane.appendChild(this._canvas);
    this._ctx=this._canvas.getContext('2d');
    map.on('moveend zoomend resize',this._reset,this);
    this._reset();
  },
  onRemove(map) { this._canvas.remove(); map.off('moveend zoomend resize',this._reset,this); },
  setActiveStop(id) { this._activeStopId=id; this._draw(); },
  setRouteFilter(ids) { this._routeStopIds=ids; this._draw(); },
  _reset() {
    const size=this._map.getSize();
    this._canvas.width=size.x; this._canvas.height=size.y;
    L.DomUtil.setPosition(this._canvas,this._map.containerPointToLayerPoint([0,0]));
    this._draw();
  },
  _draw() {
    const ctx=this._ctx, m=this._map;
    if (!ctx||!m) return;
    ctx.clearRect(0,0,this._canvas.width,this._canvas.height);
    if (!STOPS||m.getZoom()<14) return;
    const b=m.getBounds(), sw=b.getSouth(),ne=b.getNorth(),ww=b.getWest(),ew=b.getEast();
    const z=m.getZoom(), r=z>=16?4.5:z>=15?3.5:2.5, rId=this._routeStopIds;
    const isDark = currentTheme === 'dark';
    const normalPts=[], dimPts=[], activePts=[];
    for (const [sid,s] of Object.entries(STOPS)) {
      const la=s.a, lo=s.o;
      if (la<sw||la>ne||lo<ww||lo>ew) continue;
      const pt=m.latLngToContainerPoint([la,lo]);
      if (sid===this._activeStopId) activePts.push(pt);
      else if (rId&&!rId.has(sid))  dimPts.push(pt);
      else                          normalPts.push(pt);
    }
    if (dimPts.length) {
      ctx.beginPath(); for (const p of dimPts) { ctx.moveTo(p.x+r,p.y); ctx.arc(p.x,p.y,r,0,Math.PI*2); }
      ctx.fillStyle = isDark ? 'rgba(148,163,184,0.15)' : 'rgba(104,116,131,0.18)';
      ctx.fill();
    }
    if (normalPts.length) {
      ctx.beginPath(); for (const p of normalPts) { ctx.moveTo(p.x+r,p.y); ctx.arc(p.x,p.y,r,0,Math.PI*2); }
      ctx.fillStyle = isDark ? 'rgba(241,245,249,0.75)' : 'rgba(51,51,50,0.65)';
      ctx.strokeStyle = isDark ? 'rgba(15,23,42,0.8)' : 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1;
      ctx.fill(); ctx.stroke();
    }
    if (activePts.length) {
      const ra=r+3.5;
      ctx.beginPath(); for (const p of activePts) { ctx.moveTo(p.x+ra,p.y); ctx.arc(p.x,p.y,ra,0,Math.PI*2); }
      ctx.fillStyle = isDark ? '#34D399' : '#0D5C3A';
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.5;
      ctx.fill(); ctx.stroke();
    }
  },
  getStopAt(containerPoint) {
    if (!STOPS||!this._map||this._map.getZoom()<14) return null;
    const b=this._map.getBounds(), sw=b.getSouth(),ne=b.getNorth(),ww=b.getWest(),ew=b.getEast();
    let best=null, bestD=14;
    for (const [sid,s] of Object.entries(STOPS)) {
      if (s.a<sw||s.a>ne||s.o<ww||s.o>ew) continue;
      const pt=this._map.latLngToContainerPoint([s.a,s.o]);
      const d=Math.hypot(containerPoint.x-pt.x,containerPoint.y-pt.y);
      if (d<bestD) { bestD=d; best=sid; }
    }
    return best;
  },
});

// ── Custom canvas arrow layer ─────────────────────────────────────────────────
const ArrowLayer = L.Layer.extend({
  initialize() { this._vehicles=[]; },
  onAdd(map) {
    this._map=map;
    this._canvas=L.DomUtil.create('canvas','leaflet-layer');
    map.getPanes().overlayPane.appendChild(this._canvas);
    this._ctx=this._canvas.getContext('2d');
    map.on('moveend zoomend resize',this._reset,this);
    this._reset();
  },
  onRemove(map) { this._canvas.remove(); map.off('moveend zoomend resize',this._reset,this); },
  setVehicles(vehicles) { this._vehicles=vehicles; this._draw(); },
  _reset() {
    const size=this._map.getSize();
    this._canvas.width=size.x; this._canvas.height=size.y;
    L.DomUtil.setPosition(this._canvas,this._map.containerPointToLayerPoint([0,0]));
    this._draw();
  },
  _draw() {
    const ctx=this._ctx, m=this._map;
    if (!ctx||!m) return;
    ctx.clearRect(0,0,this._canvas.width,this._canvas.height);
    for (const v of this._vehicles) {
      const pt=m.latLngToContainerPoint([v.lat,v.lng]);
      const x=pt.x, y=pt.y, color=v.c;
      const isActive=v.vehicleId===activeId, isDimmed=activeFilter&&!activeFilter.matchIds.has(v.vehicleId);
      ctx.save();
      ctx.translate(x,y);
      ctx.globalAlpha = isDimmed ? 0.15 : 1;
      if (isActive) {
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI * 2);
        ctx.fillStyle = currentTheme === 'dark' ? 'rgba(52, 211, 153, 0.3)' : 'rgba(13, 92, 58, 0.25)';
        ctx.fill();
      }
      if (v.bearing!=null) {
        ctx.rotate((v.bearing*Math.PI)/180);
        ctx.beginPath();
        ctx.moveTo(0,-9);
        ctx.lineTo(6,6);
        ctx.lineTo(0,2.5);
        ctx.lineTo(-6,6);
        ctx.closePath();
        ctx.fillStyle=color;
        ctx.strokeStyle=isActive ? '#FFFFFF' : 'rgba(0,0,0,0.5)';
        ctx.lineWidth=isActive ? 2 : 1;
        ctx.fill(); ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0,0,isActive?7:5.5,0,Math.PI*2);
        ctx.fillStyle=color;
        ctx.strokeStyle=isActive ? '#FFFFFF' : 'rgba(0,0,0,0.5)';
        ctx.lineWidth=isActive ? 2 : 1;
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
  },
  getVehicleAt(containerPoint) {
    for (const v of this._vehicles) {
      const pt=this._map.latLngToContainerPoint([v.lat,v.lng]);
      if (Math.hypot(containerPoint.x-pt.x,containerPoint.y-pt.y)<12) return v.vehicleId;
    }
    return null;
  },
});

// ── Stop marker layer (route stops for selected vehicle) ──────────────────────
const StopLayer = L.Layer.extend({
  onAdd(map) { this._map=map; map.on('moveend zoomend',this._draw,this); this._draw(); },
  onRemove(map) { map.off('moveend zoomend',this._draw,this); this._markers?.forEach(m=>m.remove()); this._markers=[]; },
  _markers:[], _routeStops:[],
  setRouteStops(stops) { this._routeStops=stops; this._draw(); },
  clearRouteStops()    { this._routeStops=[]; this._draw(); },
  _draw() {
    if (!this._map) return;
    this._markers.forEach(m=>m.remove()); this._markers=[];
    if (!this._routeStops.length) return;
    const isDark = currentTheme === 'dark';
    const styles = {
      start:    {color: isDark ? '#10B981' : '#009E47', fill: isDark ? '#10B981' : '#009E47', r:7, weight:2, opacity:1  },
      passed:   {color: isDark ? '#475569' : '#8695A8', fill: isDark ? '#1E293B' : '#CFD5DD', r:4, weight:1, opacity:0.6},
      current:  {color: isDark ? '#34D399' : '#0D5C3A', fill: isDark ? '#34D399' : '#0D5C3A', r:9, weight:3, opacity:1  },
      upcoming: {color: isDark ? '#94A3B8' : '#687483', fill: isDark ? '#1E293B' : '#FFFFFF', r:5, weight:2, opacity:0.95},
      terminal: {color: isDark ? '#F87171' : '#D2373C', fill: isDark ? '#F87171' : '#D2373C', r:7, weight:2, opacity:1  },
    };
    for (const stop of this._routeStops) {
      const s=styles[stop.status]||styles.upcoming;
      const m=L.circleMarker([stop.lat,stop.lon],{radius:s.r,color:s.color,fillColor:s.fill,weight:s.weight,opacity:s.opacity,fillOpacity:s.opacity*0.85,className:'stop-mk',interactive:false}).addTo(this._map);
      if (stop.name) m.bindTooltip(stop.name,{permanent:false,direction:'top',className:'stop-tip'});
      this._markers.push(m);
    }
  }
});

// ── URL state ─────────────────────────────────────────────────────────────────
const URL_KEYS=['line','route','trip','type','vehicle','agency'];
function pushUrlState(params) {
  const url=new URL(location.href);
  URL_KEYS.forEach(k=>url.searchParams.delete(k));
  for (const [k,v] of Object.entries(params||{})) { if (v!=null&&v!=='') url.searchParams.set(k,String(v)); }
  history.replaceState(null,'',url.toString());
}
function filterUrlParams() { if (!activeFilter?.urlKey) return {}; return {[activeFilter.urlKey]:activeFilter.urlVal}; }

async function restoreFromUrl() {
  const sp=new URLSearchParams(location.search);
  const pLine=sp.get('line'),pRoute=sp.get('route'),pTrip=sp.get('trip'),pType=sp.get('type'),pVehicle=sp.get('vehicle');
  if (!pLine&&!pRoute&&!pTrip&&!pType&&!pVehicle) return;
  await new Promise(resolve => { if (SL) return resolve(); const id=setInterval(()=>{if(SL){clearInterval(id);resolve();}},50); setTimeout(()=>{clearInterval(id);resolve();},5000); });
  if (pType) {
    const entry=Object.entries(ROUTE_TYPES).find(([code])=>code===pType);
    if (entry) { const [code,label]=entry; const matchIds=new Set(Object.values(vData).filter(v=>(getLine(v.tripId)?.type||'3')===code).map(v=>v.vehicleId)); applyFilter({matchIds,label,urlKey:'type',urlVal:code},true); }
  } else if (pLine&&SL?.lines?.[pLine]) {
    const l=SL.lines[pLine];
    const matchIds=new Set(Object.values(vData).filter(v=>v.tripId?.split('_')[0]===pLine).map(v=>v.vehicleId));
    const shapeIds=new Set(Object.values(vData).filter(v=>v.tripId?.split('_')[0]===pLine).map(v=>getTrip(v.tripId)?.shapeId).filter(Boolean));
    const shapeId=shapeIds.size===1?[...shapeIds][0]:null;
    const dirs=[l.dir0,l.dir1].filter(Boolean), label=`${l.name}${dirs.length?' · '+dirs.join(' ↔ '):''}`;
    applyFilter({matchIds,label,shapeId,urlKey:'line',urlVal:pLine},true);
  } else if (pRoute) {
    const matchIds=new Set(); let shapeId=null,lName='',hs='';
    for (const v of Object.values(vData)) { const ti=getTrip(v.tripId); if (ti?.routeId!==pRoute) continue; matchIds.add(v.vehicleId); if (!shapeId&&ti.shapeId) shapeId=ti.shapeId; if (!lName) lName=getLine(v.tripId)?.name||''; if (!hs) hs=ti.headsign||''; }
    if (matchIds.size) applyFilter({matchIds,label:`${lName} → ${hs}`,shapeId,urlKey:'route',urlVal:pRoute},true);
  } else if (pTrip) {
    const v=Object.values(vData).find(v=>v.tripId?.split('_').slice(0,3).join('_')===pTrip||v.tripId===pTrip);
    if (v) applyFilter({matchIds:new Set([v.vehicleId]),label:`Rit ${pTrip}`,shapeId:getTrip(v.tripId)?.shapeId||null,urlKey:'trip',urlVal:pTrip},true);
  }
  if (pVehicle) { const v=Object.values(vData).find(v=>v.vehicleId===pVehicle); if (v) { select(v.vehicleId); openPanel(v.vehicleId); } }
}

function moveDrop(dir){
  const els=sdrop.querySelectorAll(".sd-item"); if (!els.length) return;
  els[dropHi]?.classList.remove("hi");
  dropHi=Math.max(0,Math.min(els.length-1,dropHi+dir));

function buildDrop(){
  const q=sinput.value.trim().toLowerCase();
  sclear.style.display=q?"flex":"none";
  if (!q){closeDrop();return;}
  const groups=[];
  const agencyName=SL?.agency?.['delijn']?.name||'De Lijn';

  if (agencyName.toLowerCase().includes(q)) {
    groups.push({label:'Vervoermaatschappij',items:[{badge:'ALL',color:'#0D5C3A',textC:'#ffffff',main:agencyName,sub:`${Object.keys(vData).length} voertuigen`,apply(){applyFilter(null);}}]});
  }
  const typeMatches=[];
  for (const [code,label] of Object.entries(ROUTE_TYPES)) {
    if (!label.toLowerCase().includes(q)) continue;
    const matchIds=new Set(Object.values(vData).filter(v=>(getLine(v.tripId)?.type||'3')===code).map(v=>v.vehicleId));
    if (matchIds.size>0) typeMatches.push({badge:label[0],color:'#0D5C3A',textC:'#ffffff',main:label,sub:`${matchIds.size} voertuigen`,apply(){applyFilter({matchIds,label,urlKey:'type',urlVal:code});}});
  }
  if (typeMatches.length) groups.push({label:'Vervoerstype',items:typeMatches});

  if (SL?.lines) {
    const lineItems=[];
    for (const [code,l] of Object.entries(SL.lines)) {
      if (!l.name.toLowerCase().includes(q)) continue;
      const matchIds=new Set(), shapeIds=new Set();
      for (const v of Object.values(vData)) { if (v.tripId?.split('_')[0]!==code) continue; matchIds.add(v.vehicleId); const sid=getTrip(v.tripId)?.shapeId; if (sid) shapeIds.add(sid); }
      if (!matchIds.size) continue;
      const color=l.color?'#'+l.color:'#0D5C3A', textC=l.textColor?'#'+l.textColor:'#ffffff';
      const snap=new Set(matchIds), shapeId=shapeIds.size===1?[...shapeIds][0]:null;
      const dirs=[l.dir0,l.dir1].filter(Boolean), label=`${l.name}${dirs.length?' · '+dirs.join(' ↔ '):''}`;
      lineItems.push({badge:l.name,color,textC,main:label,sub:`${snap.size} voertuig${snap.size!==1?'en':''}`,apply(){applyFilter({matchIds:snap,label,shapeId,urlKey:'line',urlVal:code});}});
    }
    if (lineItems.length) groups.push({label:'Lijn',items:lineItems.slice(0,8)});
  }

  if (SL?.trips) {
    const routeHits=new Map();
    for (const v of Object.values(vData)) {
      const ti=getTrip(v.tripId), li=getLine(v.tripId)||{}; if (!ti) continue;
      const rid=ti.routeId, name=li.name||'', hs=ti.headsign||'', label=`${name} → ${hs}`;
      if (!label.toLowerCase().includes(q)&&!rid?.toLowerCase().includes(q)) continue;
      if (!routeHits.has(rid)) routeHits.set(rid,{lineName:name,headsign:hs,color:li.color,textColor:li.textColor,matchIds:new Set(),shapeId:ti.shapeId||null});
      routeHits.get(rid).matchIds.add(v.vehicleId);
    }
    const routeItems=[];
    for (const [rid,entry] of routeHits) {
      const color=entry.color?'#'+entry.color:'#0D5C3A', textC=entry.textColor?'#'+entry.textColor:'#ffffff', snap=new Set(entry.matchIds);
      routeItems.push({badge:entry.lineName,color,textC,main:`${entry.lineName} → ${entry.headsign}`,sub:`${snap.size} voertuigen`,apply(){applyFilter({matchIds:snap,label:`${entry.lineName} → ${entry.headsign}`,shapeId:entry.shapeId,urlKey:'route',urlVal:rid});}});
    }
    if (routeItems.length) groups.push({label:'Route',items:routeItems.slice(0,6)});
  }

  const tripItems=[];
  for (const v of Object.values(vData)) {
    if (!v.tripId?.toLowerCase().includes(q)) continue;
    const name=lineName(v.tripId),dest=lineDest(v.tripId),c=markerCol(v.tripId),tc=lineTextColor(v.tripId),d=fmtD(v.delay),snap=new Set([v.vehicleId]),tripShapeId=getTrip(v.tripId)?.shapeId||null;
    tripItems.push({badge:name,color:c,textC:tc,main:dest?`${name} → ${dest}`:v.tripId.slice(0,30),sub:v.vehicleId,delayText:d.text,delayCls:d.cls,apply(){const tripKey=v.tripId.split('_').slice(0,3).join('_');applyFilter({matchIds:snap,label:`Rit ${tripKey}`,shapeId:tripShapeId,urlKey:'trip',urlVal:tripKey});select(v.vehicleId);openPanel(v.vehicleId);}});
  }
  if (tripItems.length) groups.push({label:'Rit',items:tripItems.slice(0,4)});

  const vehItems=[];
  for (const v of Object.values(vData)) {
    if (!v.vehicleId?.toLowerCase().includes(q)) continue;
    const name=lineName(v.tripId),dest=lineDest(v.tripId),c=markerCol(v.tripId),tc=lineTextColor(v.tripId),d=fmtD(v.delay),snap=new Set([v.vehicleId]);
    vehItems.push({badge:name,color:c,textC:tc,main:dest?`${name} → ${dest}`:name,sub:v.vehicleId,delayText:d.text,delayCls:d.cls,apply(){applyFilter({matchIds:snap,label:`Voertuig ${v.vehicleId}`});select(v.vehicleId);openPanel(v.vehicleId);}});
  }
  if (vehItems.length) groups.push({label:'Voertuig',items:vehItems.slice(0,4)});

  if (STOPS) {
    const stopItems=[];
    for (const [sid,s] of Object.entries(STOPS)) {
      if (!s.n?.toLowerCase().includes(q)&&!sid.includes(q)) continue;
      const snapSid=sid, snapS=s;
      stopItems.push({badge:'H',color:'#0D5C3A',textC:'#ffffff',main:s.n,sub:`Halte ${sid}`,
        apply(){closeDrop();sinput.value='';sclear.style.display='none';map.flyTo([snapS.a,snapS.o],Math.max(map.getZoom(),17),{animate:true,duration:0.8});setTimeout(()=>selectStop(snapSid),850);}});
      if (stopItems.length>=6) break;
    }
    if (stopItems.length) groups.push({label:'Halte',items:stopItems});
  }

  dropItems=[];
  if (!groups.length) { sdrop.innerHTML=`<div style="padding:12px 14px;font-size:12px;color:var(--text-dim)">Geen resultaten</div>`; sdrop.classList.add("on"); return; }

  let html='';
  for (const g of groups) {
    html+=`<div class="sd-group">${g.label}</div>`;
    for (const it of g.items) {
      const idx=dropItems.length; dropItems.push(it);
      const delaySpan=it.delayText?`<span class="sd-delay" style="color:var(--${it.delayCls})">${it.delayText}</span>`:(it.sub?`<span class="sd-sub">${it.sub}</span>`:'');
      html+=`<div class="sd-item" data-i="${idx}"><span class="sd-badge" style="background:${it.color};color:${it.textC}">${it.badge}</span><span class="sd-main">${it.main}</span>${delaySpan}</div>`;
    }
  }
  sdrop.innerHTML=html;
  sdrop.querySelectorAll(".sd-item").forEach(el=>{ el.addEventListener("mousedown",e=>{e.preventDefault();dropItems[+el.dataset.i]?.apply();closeDrop();}); });
  sdrop.classList.add("on"); dropHi=-1;
}

function applyFilter(filter, skipPush=false) {
  activeFilter=filter;
  if (!skipPush) pushUrlState(filter?{[filter.urlKey]:filter.urlVal}:{});
  const all=Object.values(vData).sort((a,b)=>(b.delay||0)-(a.delay||0));
  sortedV=filter?all.filter(v=>filter.matchIds.has(v.vehicleId)):all;
  G("bv").textContent=sortedV.length;
  if (filter?.shapeId) {
    const anyV=filter.matchIds.size?Object.values(vData).find(v=>filter.matchIds.has(v.vehicleId)):null;
    showShape(filter.shapeId,anyV?.tripId?.split('_')[0]||null,true);
  } else if (!filter||filter.matchIds.size>1) { clearShape(); stopLayer.clearRouteStops(); }
  const win=G("wv"); [...win.children].forEach(ch=>{win.removeChild(ch);freeRow(ch);}); G("pv").scrollTop=0;
  allStopsLayer.setRouteFilter(filter?getFilterStopIds():null);
  arrowLayer._draw(); redraw();
  if (filter) { sinput.value=filter.label; sclear.style.display="flex"; }
}
