function showStopPopup(stopId, doorkomsten) {
  const s=STOPS?.[stopId]; if (!s) return;
  if (activeStopPopup) { activeStopPopup.remove(); activeStopPopup=null; }

  const lineCodes = STOP_INDEX?.[stopId] || [];
  const linesHtml = lineCodes.length
    ? lineCodes.slice(0,20).map(lc => {
        const l=SL?.lines?.[lc]; if (!l) return '';
        const c=l.color?'#'+l.color:'#0D5C3A', tc=l.textColor?'#'+l.textColor:'#ffffff';
        return `<span class="sp-approach-badge sp-line-badge" style="background:${c};color:${tc};" onclick="filterByLine('${lc}')" title="Toon lijn ${l.name} op kaart">${l.name}</span>`;
      }).filter(Boolean).join('')
    : '<span class="sp-none">–</span>';

  const departuresHtml = buildDoorkomstenHtml(doorkomsten);

  activeStopPopup = L.popup({maxWidth:330, minWidth:280, closeButton:false})
    .setLatLng([s.a, s.o])
    .setContent(`<div class="mp" style="max-height:420px;overflow-y:auto">
      <div class="sp-name">${s.n}</div>
      <div class="sp-id">Halte-ID: ${stopId}</div>
      ${lineCodes.length ? `<div class="sp-section-label" style="margin-top:10px">Bediende lijnen</div><div class="sp-lines">${linesHtml}</div>` : ''}
      <div class="sp-section-label" style="margin-top:10px">Live Doorkomsten</div>
      <div id="dk-list-${stopId}">${departuresHtml}</div>
    </div>`)
    .openOn(map);
}

async function selectStop(stopId) {
  if (G('info-panel').classList.contains('open')) closePanel();
  closeStopPopup();
  activeStopId=stopId; allStopsLayer.setActiveStop(stopId);

  await loadStops();
  if (!STOPS?.[stopId]) {
    console.warn('[GT] selectStop: stop', stopId, 'not found in stops.json');
    return;
  }

  showStopPopup(stopId, undefined);

  const [doorkomsten] = await Promise.all([
    fetchStopDoorkomsten(stopId),
    (async () => {
      await loadStopIndex();
      if (activeStopId !== stopId) return;
      const lines = STOP_INDEX?.[stopId] || [];
      if (lines.length > 0) await Promise.all(lines.slice(0, 8).map(lc => loadStopTimes(lc)));
    })(),
  ]);

  if (activeStopId !== stopId) return;
  showStopPopup(stopId, doorkomsten);
}

// ── Virtual scroll ────────────────────────────────────────────────────────────
const pool=[];
function getRow(){return pool.pop()||document.createElement("div")}
function freeRow(el){pool.push(el)}

function drawList(paneId,spacerId,winId,items,rowH,renderFn){
  const pane=G(paneId),spacer=G(spacerId),win=G(winId);
  spacer.style.height=(items.length*rowH)+"px";
  const scrollTop=pane.scrollTop,viewH=pane.clientHeight;
  const b0=Math.max(0,Math.floor(scrollTop/rowH)-4);
  const b1=Math.min(items.length-1,Math.ceil((scrollTop+viewH)/rowH)+4);
  const keep=new Set();for(let i=b0;i<=b1;i++)keep.add(i);
  for(const ch of[...win.children]){const idx=+ch.dataset.i;if(!keep.has(idx)){win.removeChild(ch);freeRow(ch)}}
  const existing=new Set([...win.children].map(c=>+c.dataset.i));
  for(let i=b0;i<=b1;i++){
    if(existing.has(i))continue;
    const item=items[i];if(!item)continue;
    const row=getRow();renderFn(row,item);row.dataset.i=i;
    row.style.cssText=`position:absolute;top:${i*rowH}px;left:0;right:0;height:${rowH}px;`;
    win.appendChild(row);
  }
}

function renderV(row,v){
  const d=fmtD(v.delay), name=lineName(v.tripId), dest=lineDest(v.tripId)||v.vehicleId, c=markerCol(v.tripId), tc=lineTextColor(v.tripId);
  row.className="vr"+(v.vehicleId===activeId?" sel":"");
  row.onclick=()=>{select(v.vehicleId);openPanel(v.vehicleId);};
  row.innerHTML=`<div class="badge" style="background:${c};color:${tc}">${name}</div><div class="ri"><div class="rr">${dest}</div><div class="rm">${v.vehicleId}</div></div><div class="rd" style="color:var(--${d.cls})">${d.text}</div>`;
}

function renderC(row,c){
  row.className="vr cr";
  row.innerHTML=`<div class="badge" style="background:rgba(210,55,60,0.12);color:var(--danger);border:1px solid rgba(210,55,60,0.3)">${lineName(c.tripId)}</div><div class="ri"><div class="rr" style="color:var(--text-dim);text-decoration:line-through">${lineDest(c.tripId)||c.tripId.split('_').slice(0,3).join('_')}</div><div class="rm">${c.routeId||'–'}</div></div><div class="cx">Afgeschaft</div>`;
}

function redraw(){
  drawList("pv","sv2","wv",sortedV,IH_V,renderV);
  drawList("pc","sc3","wc",sortedC,IH_C,renderC);
}

G("pv").addEventListener("scroll",()=>drawList("pv","sv2","wv",sortedV,IH_V,renderV),{passive:true});
G("pc").addEventListener("scroll",()=>drawList("pc","sc3","wc",sortedC,IH_C,renderC),{passive:true});

// ── Vehicle popup ─────────────────────────────────────────────────────────────
let activePopup=null;
function showPopup(id){
  const v=vData[id]; if(!v) return;
  const name=lineName(v.tripId), dest=lineDest(v.tripId)||'–', color=markerCol(v.tripId), textC=lineTextColor(v.tripId), url=getLine(v.tripId)?.url||'', d=fmtD(v.delay);
  if (activePopup){activePopup.remove();activePopup=null;}
  activePopup=L.popup({maxWidth:260,minWidth:220,closeButton:false})
    .setLatLng([v.lat,v.lng])
    .setContent(`<div class="mp"><div class="mp-badge" style="background:${color};color:${textC}">${name}</div><div class="mp-dest">→ ${dest}</div><div class="mp-sub">Voertuig: ${v.vehicleId}</div><div class="mp-delay" style="color:var(--${d.cls})">${d.text}</div>${url?`<a class="mp-link" href="${url}" target="_blank" rel="noopener">Lijninfo openen ↗</a>`:''}<button class="mp-btn" onclick="openPanel('${id}')">Meer details</button></div>`)
    .openOn(map);
}

let _renderToken=0;
function openPanel(id){
  const v=vData[id]; if(!v) return;
  closeStopPopup(); activeId=id; ++_renderToken;
  const lineInfo=getLine(v.tripId)||{}, tripInfo=getTrip(v.tripId)||{}, routeInfo=getRoute(tripInfo.routeId||v.routeId)||{};
  const name=routeInfo.name||lineInfo.name||'–', dest=tripInfo.headsign||'–';
  const color='#'+(routeInfo.color||lineInfo.color||'0D5C3A'), textC='#'+(routeInfo.textColor||lineInfo.textColor||'fff');
  const routeLong=routeInfo.long||lineInfo[`dir${tripInfo.dir}`]||lineInfo.dir0||'–';
  const url=routeInfo.url||lineInfo.url||'', type=routeInfo.type||lineInfo.type||'3';
  const typeLabel=ROUTE_TYPES[type]||'Bus', routeId=tripInfo.routeId||v.routeId||'–';
  const lineCode=v.tripId?.split('_')[0]||'–', d=fmtD(v.delay);
  const t0=lineInfo.dir0||'', t1=lineInfo.dir1||'';
  const terminals=(t0&&t1)?`${t0} ↔ ${t1}`:(t0||t1||'–');
  const ag=SL?.agency?.['delijn']||{}, feed=SL?.feed||{};

  pushUrlState({...filterUrlParams(),vehicle:v.vehicleId,agency:'delijn'});
  G("ip-badge").textContent=name; G("ip-badge").style.background=color; G("ip-badge").style.color=textC;
  G("ip-title").textContent=dest;

  G("ip-body").innerHTML=`
    <div style="margin-bottom:16px"><button class="ip-share-btn" onclick="shareVehicleUrl()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>Deel dit voertuig</span></button></div>
    <div class="ip-section"><div class="ip-section-title">Route-informatie</div><div class="ip-grid">
      <div class="ip-field"><div class="ip-label">Lijn</div><div class="ip-value accent"><span class="ip-swatch" style="background:${color}"></span>${name}</div></div>
      <div class="ip-field"><div class="ip-label">Type</div><div class="ip-value">${typeLabel}</div></div>
      <div class="ip-field ip-full"><div class="ip-label">Richting</div><div class="ip-value">→ ${dest}</div></div>
      <div class="ip-field ip-full"><div class="ip-label">Volledig traject</div><div class="ip-value" style="font-size:12px">${routeLong}</div></div>
      <div class="ip-field ip-full"><div class="ip-label">Eindhaltes</div><div class="ip-value" style="font-size:12px;color:var(--text-dim)">${terminals}</div></div>
      <div class="ip-field"><div class="ip-label">Interne Lijncode</div><div class="ip-value di" style="font-size:12px">${lineCode}</div></div>
      <div class="ip-field"><div class="ip-label">Route-ID</div><div class="ip-value di" style="font-size:12px">${routeId}</div></div>
      ${url?`<div class="ip-field ip-full"><div class="ip-label">Dienstregeling & Info</div><div class="ip-value"><a class="ip-link" href="${url}" target="_blank" rel="noopener">Open pagina ↗</a></div></div>`:''}
    </div></div>
    <div class="ip-section"><div class="ip-section-title">Realtime Status</div><div class="ip-grid">
      <div class="ip-field"><div class="ip-label">Vertraging</div><div class="ip-value ${d.cls}">${d.text}</div></div>
      <div class="ip-field"><div class="ip-label">Koers</div><div class="ip-value">${fmtB(v.bearing)}</div></div>
      <div class="ip-field"><div class="ip-label">Breedtegraad</div><div class="ip-value">${v.lat.toFixed(5)}</div></div>
      <div class="ip-field"><div class="ip-label">Lengtegraad</div><div class="ip-value">${v.lng.toFixed(5)}</div></div>
      <div class="ip-field ip-full"><div class="ip-label">Ritcode (Trip ID)</div><div class="ip-value" style="font-size:11px;color:var(--text-dim)">${v.tripId||'–'}</div></div>
    </div></div>
    <div class="ip-section"><div class="ip-section-title">Voertuiggegevens</div><div class="ip-grid">
      <div class="ip-field"><div class="ip-label">Voertuignummer</div><div class="ip-value">${v.vehicleId}</div></div>
      <div class="ip-field"><div class="ip-label">Vervoerder</div><div class="ip-value">${ag.name||'De Lijn'}</div></div>
    </div></div>
    <div class="ip-section" id="stops-section"><div class="ip-section-title">Haltes op dit traject</div><div id="stops-list" style="color:var(--text-dim);font-size:12px">Haltes laden…</div></div>
    ${feed.version?`<div class="ip-section"><div class="ip-section-title">Feed Metadata</div><div class="ip-grid"><div class="ip-field"><div class="ip-label">Versie</div><div class="ip-value" style="font-size:11px;color:var(--text-dim)">${feed.version}</div></div><div class="ip-field"><div class="ip-label">Geldig tot</div><div class="ip-value" style="font-size:12px">${feed.endDate?feed.endDate.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):'–'}</div></div></div></div>`:''}
  `;

  G("info-panel").classList.add("open"); G("ip-body").scrollTop=0;
  panToVehicle(v,Math.max(map.getZoom(),13));

  const _vid=v.vehicleId, _lc=v.tripId?.split('_')[0];
  ;(async()=>{
    clearShape(); stopLayer.clearRouteStops();
    if (tripInfo.shapeId) { try{await showShape(tripInfo.shapeId,_lc);}catch(e){console.warn('showShape:',e.message);} }
    if (activeId!==_vid) return;
    try {
      await loadStops(); if (activeId!==_vid) return;
      await loadStopTimes(v.tripId); if (activeId!==_vid) return;
      await renderStopMarkers(v); if (activeId===_vid) await renderStopsForVehicle(v);
    } catch(e) { console.warn('stop loading:',e.message); const el=G("stops-list"); if (el&&activeId===_vid) el.textContent='Fout bij het laden van haltes'; }
  })();
  redraw();
}

function shareVehicleUrl() {
  const url=location.href;
  if (navigator.share) navigator.share({title:document.title,url}).catch(()=>{});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('Link gekopieerd naar klembord'));
  else prompt('Kopieer deze link:',url);
}

async function renderStopsForVehicle(v) {
  const el=G("stops-list"); if (!el) return;
  try {
    await Promise.all([loadStops(),loadStopTimes(v.tripId)]);
    if (activeId!==v.vehicleId) return;
    const stops=getTripStops(v.tripId);
    if (!stops?.length){el.textContent='Geen haltegegevens beschikbaar';return;}
    const nowMins=new Date().getHours()*60+new Date().getMinutes(), delayMins=Math.round((v.delay||0)/60);
    let nextIdx=stops.findIndex(s=>s.a!=null&&(s.a+delayMins)>=nowMins); if (nextIdx<0) nextIdx=stops.length;
    const rows=stops.map((st,i)=>{
      const stop=getStop(st.s), name=stop?.name||st.s;
      const isPast=i<nextIdx, isNext=i===nextIdx, isTerm=i===stops.length-1;
      const dotCls=isTerm?'term':isNext?'next':isPast?'passed':'', nameCls=isPast?'passed':'';
      let timesHtml='';
      if (st.a!=null){
        const sched=fmtMins(st.a), adj=fmtMins(st.a+delayMins), late=delayMins>=2?(delayMins>=5?'vlate':'late'):'adj';
        timesHtml=`<span style="color:var(--text-dim)">${sched}</span>`+(delayMins!==0?` <span class="${isPast?'':late}">${adj}</span>`:'');
      }
      return`<div class="stop-row"><div class="stop-dot ${dotCls}"></div><div class="stop-info"><div class="stop-name ${nameCls}">${name}</div>${timesHtml?`<div class="stop-times">${timesHtml}</div>`:''}</div></div>`;
    });
    el.innerHTML=`<div class="stop-list">${rows.join('')}</div>`;
    if (nextIdx>2){const rowEls=el.querySelectorAll('.stop-row');rowEls[Math.max(0,nextIdx-1)]?.scrollIntoView({block:'start',behavior:'smooth'});}
  } catch(e) { console.warn('renderStopsForVehicle:',e); const el2=G("stops-list"); if (el2&&activeId===v.vehicleId) el2.textContent='Fout bij het laden van haltes'; }
}

async function renderStopMarkers(v) {
  if (!v?.tripId) return;
  const seq=getTripStops(v.tripId); if (!seq?.length||activeId!==v.vehicleId) return;
  const nowMins=new Date().getHours()*60+new Date().getMinutes(), delayMins=Math.round((v.delay||0)/60);
  let nextIdx=seq.findIndex(s=>s.a!=null&&(s.a+delayMins)>=nowMins); if (nextIdx<0) nextIdx=seq.length;
  const markers=seq.map((st,i)=>{
    const stop=getStop(st.s); if (!stop||!isFinite(stop.lat)||!isFinite(stop.lon)) return null;
    let status=i===0?'start':i===seq.length-1?'terminal':i<nextIdx?'passed':i===nextIdx?'current':'upcoming';
    return {lat:stop.lat,lon:stop.lon,name:stop.name,status};
  }).filter(Boolean);
  stopLayer.setRouteStops(markers);
}

function closePanel(){
  G("info-panel").classList.remove("open");
  if (activePopup){activePopup.remove();activePopup=null;}
  activeId=null; clearShape(); stopLayer.clearRouteStops(); pushUrlState({}); arrowLayer._draw(); redraw();
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function refresh(){
  const pd=G("pd"),lt=G("lt");
  pd.className="pulse spin"; lt.textContent="Bijwerken…";
  let data;
  try{
    const r=await fetch("/api/gtfs",{cache:"no-store"});
    if(!r.ok){const e=await r.json().catch(()=>({error:`HTTP ${r.status}`}));throw new Error(e.error)}
    data=await r.json();
  }catch(err){pd.className="pulse err";lt.textContent="Fout";toast("⚠ "+err.message,true);return}
  pd.className="pulse"; lt.textContent="Live";
  G("ts").textContent=new Date().toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  process(data); startBar();
}

function process(data){
  const vehicles=data.vehicles||[], canceled=data.canceled||[];
  const seen=new Set(); let onTime=0,delayed=0,early=0;
  for(const v of vehicles){
    const id=v.vehicleId||v.tripId, c=markerCol(v.tripId), delay=v.delay;
    seen.add(id);
    if(delay!=null&&Math.abs(delay)<60)onTime++;
    else if(delay!=null&&delay>=60)delayed++;
    if(delay!=null&&delay<-30)early++;
    vData[id]={vehicleId:id,tripId:v.tripId,routeId:v.routeId,lat:v.lat,lng:v.lng,bearing:v.bearing,delay,c};
  }
  for (const id of Object.keys(vData)) { if (!seen.has(id)) { if (id===activeId) closePanel(); delete vData[id]; } }
  arrowLayer.setVehicles(Object.values(vData));
  if (activeId&&vData[activeId]) { panToVehicle(vData[activeId]); if (activePopup) activePopup.setLatLng([vData[activeId].lat,vData[activeId].lng]); }

  if (activeStopId && STOPS?.[activeStopId] && activeStopPopup) {
    fetchStopDoorkomsten(activeStopId).then(doorkomsten => {
      if (activeStopId && STOPS?.[activeStopId] && activeStopPopup) {
        showStopPopup(activeStopId, doorkomsten);
      }
    });
  }

  G("sv").textContent=vehicles.length; G("so").textContent=onTime; G("sd").textContent=delayed;
  G("sc2").textContent=canceled.length; G("se2").textContent=early; G("se").textContent=data.counts?.entities||vehicles.length+canceled.length;
  const all=Object.values(vData).sort((a,b)=>(b.delay||0)-(a.delay||0));
  sortedV=activeFilter?all.filter(v=>activeFilter.matchIds.has(v.vehicleId)):all;
  const allC=[...canceled].sort((a,b)=>a.tripId.localeCompare(b.tripId));
  sortedC=activeFilter?allC.filter(c=>activeFilter.matchIds.has(c.vehicleId||c.tripId)):allC;
  G("bv").textContent=sortedV.length; G("bc").textContent=sortedC.length;
  G("bc").style.background=sortedC.length>0?"rgba(210,55,60,0.15)":""; G("bc").style.color=sortedC.length>0?"var(--danger)":"";
  redraw();
}

function panToVehicle(v,zoom){
  const mobile=window.innerWidth<=768, panelOpen=!mobile&&G("info-panel").classList.contains("open");
  const leftPad=mobile?0:320, rightPad=panelOpen?340:0, W=window.innerWidth, z=zoom??map.getZoom();
  map.setView([v.lat,v.lng],z,{animate:false});
  const visCX=leftPad+(W-leftPad-rightPad)/2, offsetX=-(visCX-W/2);
  map.panBy([offsetX,0],{animate:true});
}

function select(id){
  activeId=id; closeStopPopup();
  const v=vData[id]; if(!v) return;
  arrowLayer._draw(); showPopup(id); closeSidebarMobile(); redraw();
}

function schedNext(){clearTimeout(rtimer);rtimer=setTimeout(async()=>{await refresh();schedNext()},REFRESH)}

let _firstLoad=true;
async function _init(){
  // Load saved or system theme preference
  const savedTheme = localStorage.getItem('geotransport-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'), false);

  initGeolocation();
  loadStatic();
  loadStopIndex();
  if (map.getZoom()>=14) loadStops();
  await refresh();
  if (_firstLoad){
    _firstLoad=false;
    await new Promise(r=>setTimeout(r,200));
    await restoreFromUrl();
  }
  schedNext();
}
_init();
</script>
